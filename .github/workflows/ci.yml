name: Android CI
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Architecture policy
        run: python3 scripts/architecture_lint.py
      - name: JVM and Android unit tests
        run: gradle --no-daemon test testDebugUnitTest --stacktrace
      - name: Android release lint
        run: gradle --no-daemon :app:lintRelease --stacktrace
      - name: Assemble unsigned release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verify Android 8+ release metadata and ABI surface
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee release-metadata.txt
          grep -F "sdkVersion:'26'" release-metadata.txt
          unzip -l "$APK" | tee release-files.txt
          if grep -Eq 'lib/[^/]+/[^/]+\.so$' release-files.txt; then
            grep -Eq 'lib/arm64-v8a/[^/]+\.so$' release-files.txt
            echo 'Native libraries present and arm64-v8a is included.' | tee release-abi.txt
          else
            echo 'No native shared libraries: APK is ABI-neutral and compatible with arm64 Android devices.' | tee release-abi.txt
          fi
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" zipalign
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt" aapt
          chmod +x zipalign aapt
          cp "$APK" AL-Agent-v1.0.0-Android8Plus-unsigned.apk
      - name: Upload release candidate and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: AL-Agent-v1.0.0-Android8Plus-release-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            AL-Agent-v1.0.0-Android8Plus-unsigned.apk
            release-metadata.txt
            release-files.txt
            release-abi.txt
            apksigner.jar
            zipalign
            aapt
            app/build/reports/lint-results-release.html
