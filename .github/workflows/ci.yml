name: Android CI
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Architecture policy
        run: python3 scripts/architecture_lint.py
      - name: Core network tests
        run: gradle :core:network:test --stacktrace
      - name: Skill loader data-only test
        continue-on-error: true
        run: gradle :skills:runtime:test --tests '*SkillRuntimeSecurityTest.loader accepts bounded data-only skill package' --stacktrace
      - name: Skill executable rejection test
        continue-on-error: true
        run: gradle :skills:runtime:test --tests '*SkillRuntimeSecurityTest.loader rejects executable skill assets' --stacktrace
      - name: Skill symlink rejection test
        continue-on-error: true
        run: gradle :skills:runtime:test --tests '*SkillRuntimeSecurityTest.loader rejects symbolic links' --stacktrace
      - name: Skill scanner test
        continue-on-error: true
        run: gradle :skills:runtime:test --tests '*SkillRuntimeSecurityTest.security scanner rejects executable instruction patterns' --stacktrace
      - name: Skill validator test
        continue-on-error: true
        run: gradle :skills:runtime:test --tests '*SkillRuntimeSecurityTest.validator rejects unknown tool ids' --stacktrace
      - name: Skill installer test
        continue-on-error: true
        run: gradle :skills:runtime:test --tests '*SkillRuntimeSecurityTest.installer stages validates and installs inside configured root' --stacktrace
      - name: Skills runtime tests
        run: gradle :skills:runtime:test --stacktrace
      - name: Agent runtime tests
        run: gradle :agent:runtime:test --stacktrace
      - name: Full JVM and Android unit tests
        run: gradle test testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
